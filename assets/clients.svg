<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="Empresas que ya lo usan: ChequeaBolivia, Importadora Martinez, Gambarte Geet Constructor">
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">

    <text x="600" y="34" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="4.5" fill="#5D6675">EMPRESAS QUE YA LO USAN</text>

    <g font-size="23" font-weight="700" letter-spacing="-0.3" fill="#FFFFFF">
      <text x="290" y="98" opacity="0.5">ChequeaBolivia
        <animate attributeName="opacity" values="0.5;1;0.5" keyTimes="0;0.16;0.5" dur="6s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="98" opacity="0.5">Importadora Martínez
        <animate attributeName="opacity" values="0.5;1;0.5" keyTimes="0;0.16;0.5" dur="6s" begin="2s" repeatCount="indefinite"/>
      </text>
      <text x="930" y="98" opacity="0.5">Gambarte Geet
        <animate attributeName="opacity" values="0.5;1;0.5" keyTimes="0;0.16;0.5" dur="6s" begin="4s" repeatCount="indefinite"/>
      </text>
    </g>

    <g stroke="#232937" stroke-width="1">
      <line x1="445" y1="76" x2="445" y2="104"/>
      <line x1="765" y1="76" x2="765" y2="104"/>
    </g>
  </g>
</svg>
