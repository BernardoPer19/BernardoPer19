<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Stack: TypeScript, Next.js, React, Node.js, PostgreSQL, Prisma, Tailwind, Express, Vercel, OpenAI y Claude API, n8n">
  <defs>
    <linearGradient id="panelS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0F16"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="-340" y1="0" x2="60" y2="0" spreadMethod="pad">
      <stop offset="0%" stop-color="#C8CFDC"/>
      <stop offset="42%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="58%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C8CFDC"/>
      <animate attributeName="x1" values="-340;1200" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="60;1600" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="150" rx="14" fill="url(#panelS)" stroke="#191E29" stroke-width="1"/>
  <rect x="200" y="0" width="800" height="1.5" fill="url(#hair)"/>

  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
    <text x="30" y="36" font-size="11.5" letter-spacing="4" fill="#5D6675">STACK DIARIO</text>

    <text x="600" y="86" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="3" fill="url(#shimmer)">TYPESCRIPT · NEXT.JS · REACT · NODE.JS · POSTGRESQL</text>

    <text x="600" y="120" text-anchor="middle" font-size="13.5" letter-spacing="2.5" fill="#6F7A8E">PRISMA · TAILWIND · EXPRESS · VERCEL · OPENAI &amp; CLAUDE API · n8n</text>
  </g>
</svg>
