<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="1200" height="8" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#11151D" stop-opacity="0"/>
      <stop offset="20%" stop-color="#232937" stop-opacity="1"/>
      <stop offset="80%" stop-color="#232937" stop-opacity="1"/>
      <stop offset="100%" stop-color="#11151D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="3" width="1200" height="2.5" fill="url(#base)"/>
  <rect y="2.25" width="340" height="4" fill="url(#pulse)">
    <animate attributeName="x" values="-340;1200" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
